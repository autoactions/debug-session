name: Smoke test Debug Sessions

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to test
        type: choice
        options:
          - both
          - linux
          - windows
        default: both
        required: true
      enable_wsl:
        description: Also test the WSL Environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: debug-session-linux
      cancel-in-progress: false
    env:
      TAILSCALE_HOSTNAME: debug-session-smoke-linux
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TAILSCALE_TAGS: tag:debug-session
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      RCLONE_HOME_LINKS: ${{ vars.RCLONE_HOME_LINKS }}
      GIT_WORKSPACES: ${{ vars.GIT_WORKSPACES }}
      GIT_WORKSPACES_TOKEN: ${{ secrets.GIT_WORKSPACES_TOKEN }}
    steps:
      - name: Set smoke deadline
        run: echo "SESSION_DEADLINE_EPOCH=$(($(date +%s) + 50 * 60))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - name: Prepare Stop Signal
        run: touch "$HOME/STOP_SESSION"
      - name: Run Linux smoke session
        env:
          ACCESS_PROFILE: full
          SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
          SESSION_PROFILE: developer
        run: bash scripts/linux.sh run
      - name: Verify Linux reserved hostname
        run: |
          hostname="$(python3 -c 'import json,subprocess,sys; status=json.loads(subprocess.check_output(["tailscale","status","--json"])); print(status["Self"]["HostName"])')"
          test "$hostname" = debug-session-smoke-linux
      - name: Verify Linux Developer Profile
        run: |
          command -v codex
          command -v grok
          command -v zsh
          test -d "$HOME/.oh-my-zsh"
          test -f "$HOME/.hushlogin"
          grep -Fq 'skip_global_compinit' "$HOME/.zshenv"
      - name: Verify Linux rclone mounts
        run: |
          if [ -z "${RCLONE_CONFIG:-}" ]; then
            echo 'RCLONE_CONFIG is empty; skipping rclone mount checks'
            exit 0
          fi
          shopt -s nullglob
          mounts=("$HOME"/rclone/*)
          (( ${#mounts[@]} > 0 )) || {
            echo 'RCLONE_CONFIG is set but no rclone mount points exist' >&2
            exit 1
          }
          for mount in "${mounts[@]}"; do
            mountpoint -q "$mount" || {
              echo "rclone mount is missing: $mount" >&2
              exit 1
            }
          done
      - name: Verify Linux rclone home links
        run: |
          if [ -z "${RCLONE_HOME_LINKS:-}" ]; then
            echo 'RCLONE_HOME_LINKS is empty; skipping home link checks'
            exit 0
          fi
          if [ -z "${RCLONE_CONFIG:-}" ]; then
            echo 'RCLONE_HOME_LINKS is set but RCLONE_CONFIG is empty; remaps are skipped'
            exit 0
          fi
          # shellcheck disable=SC1091
          source scripts/linux.sh
          while IFS=$'\t' read -r target source kind; do
            [[ -n "$target" ]] || continue
            dest="$HOME/$target"
            src="$HOME/rclone/$source"
            [[ ! -L "$dest" ]] || {
              echo "home mount is a symlink: $dest" >&2
              exit 1
            }
            mountpoint -q "$dest" || {
              echo "home mount missing: $dest" >&2
              exit 1
            }
            home_bind_matches "$dest" "$src" || {
              echo "home mount $dest is not bound to $src" >&2
              exit 1
            }
          done < <(parse_rclone_home_links)
      - name: Verify Linux git workspaces
        run: |
          if [ -z "${GIT_WORKSPACES:-}" ]; then
            echo 'GIT_WORKSPACES is empty; skipping git workspace checks'
            exit 0
          fi
          # shellcheck disable=SC1091
          source scripts/linux.sh
          while IFS=$'\t' read -r name url; do
            [[ -n "$name" ]] || continue
            dest="$(git_workspace_destination "$name")"
            [[ -d "$dest/.git" ]] || {
              echo "git workspace missing: $dest" >&2
              exit 1
            }
          done < <(parse_git_workspaces)
      - name: Clean up Linux smoke session
        if: ${{ always() }}
        run: bash scripts/linux.sh cleanup
      - name: Verify Linux logout
        if: ${{ always() }}
        run: |
          if sudo tailscale status >/dev/null 2>&1; then
            echo 'Tailscale still reports an active session' >&2
            exit 1
          fi

  windows:
    if: ${{ inputs.platform == 'both' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: debug-session-windows
      cancel-in-progress: false
    env:
      TAILSCALE_HOSTNAME: debug-session-smoke-windows
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
      TAILSCALE_TAGS: tag:debug-session
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      RCLONE_HOME_LINKS: ${{ vars.RCLONE_HOME_LINKS }}
      GIT_WORKSPACES: ${{ vars.GIT_WORKSPACES }}
      GIT_WORKSPACES_TOKEN: ${{ secrets.GIT_WORKSPACES_TOKEN }}
    steps:
      - name: Set smoke deadline
        shell: pwsh
        run: |
          $deadline = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + (50 * 60)
          "SESSION_DEADLINE_EPOCH=$deadline" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v6
      - name: Prepare Stop Signal
        shell: pwsh
        run: |
          New-Item -Path "$env:USERPROFILE\Desktop" -ItemType Directory -Force | Out-Null
          New-Item -Path "$env:USERPROFILE\Desktop\STOP_SESSION" -ItemType File -Force | Out-Null
      - name: Run Windows smoke session
        shell: pwsh
        env:
          ENABLE_WSL: ${{ inputs.enable_wsl }}
          SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
          SESSION_PROFILE: developer
        run: ./scripts/windows.ps1 run
      - name: Verify Windows reserved hostname
        shell: pwsh
        run: |
          $status = & 'C:\Program Files\Tailscale\tailscale.exe' status --json | ConvertFrom-Json
          if ($status.Self.HostName -ne 'debug-session-smoke-windows') {
            throw "Expected debug-session-smoke-windows, received $($status.Self.HostName)"
          }
      - name: Verify Windows Developer Profile
        shell: pwsh
        run: |
          Get-Command codex.cmd, grok.cmd -ErrorAction Stop
          if ('${{ inputs.enable_wsl }}' -eq 'true') {
            if ((wsl.exe --distribution Ubuntu --exec id -un).Trim() -ne 'runneradmin') {
              throw 'The WSL Environment user is not ready'
            }
          }
      - name: Verify Windows rclone mounts
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RCLONE_CONFIG)) {
            Write-Output 'RCLONE_CONFIG is empty; skipping rclone mount checks'
            exit 0
          }
          $root = Join-Path $env:USERPROFILE 'rclone'
          $mounts = @()
          if (Test-Path -LiteralPath $root) {
            $mounts = @(Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue)
          }
          if ($mounts.Count -eq 0) {
            throw 'RCLONE_CONFIG is set but no rclone mount points exist'
          }
          foreach ($mount in $mounts) {
            $attrs = $mount.Attributes
            if (-not ($attrs -band [IO.FileAttributes]::ReparsePoint)) {
              throw "rclone mount is missing: $($mount.FullName)"
            }
          }
      - name: Verify Windows rclone home links
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RCLONE_HOME_LINKS)) {
            Write-Output 'RCLONE_HOME_LINKS is empty; skipping home link checks'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:RCLONE_CONFIG)) {
            Write-Output 'RCLONE_HOME_LINKS is set but RCLONE_CONFIG is empty; remaps are skipped'
            exit 0
          }
          $windowsScript = Get-Content -LiteralPath './scripts/windows.ps1' -Raw
          $linkStart = $windowsScript.IndexOf('function Test-RcloneHomeLinkComponentValid')
          $linkEnd = $windowsScript.IndexOf('function Add-RcloneHomeLink')
          if ($linkStart -lt 0 -or $linkEnd -lt 0 -or $linkEnd -le $linkStart) {
            throw 'Windows is missing rclone home link helper functions'
          }
          Invoke-Expression $windowsScript.Substring($linkStart, $linkEnd - $linkStart)
          foreach ($link in @(Get-RcloneHomeLinks)) {
            $dest = $env:USERPROFILE
            foreach ($part in $link.Target.Split('/')) {
              $dest = Join-Path $dest $part
            }
            $src = Get-RcloneHomeSourceFullPath -Source $link.Source
            if (-not (Test-Path -LiteralPath $dest)) {
              throw "home mount missing: $dest"
            }
            $item = Get-Item -LiteralPath $dest -Force
            if ($link.Kind -eq 'file') {
              if ($item.LinkType -ne 'SymbolicLink') {
                throw "home file mount is not a symlink: $dest (LinkType=$($item.LinkType))"
              }
            } elseif ($item.LinkType -ne 'Junction') {
              throw "home directory mount is not a junction: $dest (LinkType=$($item.LinkType))"
            }
            if (-not (Test-HomeBindMatches -Item $item -SourcePath $src)) {
              throw "home mount $dest points at $(@($item.Target)[0]), expected $src"
            }
          }
      - name: Verify Windows git workspaces
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GIT_WORKSPACES)) {
            Write-Output 'GIT_WORKSPACES is empty; skipping git workspace checks'
            exit 0
          }
          $windowsScript = Get-Content -LiteralPath './scripts/windows.ps1' -Raw
          $start = $windowsScript.IndexOf('function Test-GitWorkspacesPresent')
          $end = $windowsScript.IndexOf('function Enable-GitWorkspaces')
          if ($start -lt 0 -or $end -lt 0 -or $end -le $start) {
            throw 'Windows is missing git workspace helper functions'
          }
          Invoke-Expression $windowsScript.Substring($start, $end - $start)
          foreach ($workspace in @(Get-GitWorkspaces)) {
            $dest = Get-GitWorkspaceDestination -Name $workspace.Name
            if (-not (Test-Path -LiteralPath (Join-Path $dest '.git'))) {
              throw "git workspace missing: $dest"
            }
          }
      - name: Clean up Windows smoke session
        if: ${{ always() }}
        shell: pwsh
        run: ./scripts/windows.ps1 cleanup
      - name: Verify Windows logout
        if: ${{ always() }}
        shell: pwsh
        run: |
          & 'C:\Program Files\Tailscale\tailscale.exe' status *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'Tailscale still reports an active session'
          }
